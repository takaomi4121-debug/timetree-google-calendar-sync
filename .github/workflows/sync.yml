
name: Sync TimeTree to Google Calendar

on:
  schedule:
  - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timetree-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install timetree-exporter
        run: pip install timetree-exporter

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Decode Google credentials
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          test -n "$GOOGLE_KEY"
          printf '%s' "$GOOGLE_KEY" | base64 -d > /tmp/google-credentials.json
          python -m json.tool /tmp/google-credentials.json > /dev/null

      - name: Sync Plan
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CODE_PLAN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_PLAN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-credentials.json
        run: npx tsx src/index.ts

      - name: Sync long-term
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CODE_LONGTERM }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_LONGTERM }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-credentials.json
        run: npx tsx src/index.ts

      - name: Sync SGE Twitter
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CODE_SGE }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID_SGE }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-credentials.json
        run: npx tsx src/index.ts

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/google-credentials.json
